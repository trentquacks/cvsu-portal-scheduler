{% extends "layouts/base_auth.html" %}

{% block title %}{{ notice_title }} | Student Portal - CvSU Imus{% endblock %}

{% block content %}
<div class="login-page-wrapper">
  <div class="container-lg">
    <div class="row justify-content-center mx-0">
      <div class="col-xl-4 col-lg-5 col-md-7">
        <div class="card shadow-none login-card mb-0">
          <div class="card-body p-4 p-sm-5 text-center">
            <div class="mb-3">
              <a href="/login">
                <img src="/static/assets/images/logo-dark.png" alt="Cavite State University - Imus Campus" class="login-logo">
              </a>
            </div>
            <h5 class="fw-semibold mb-3">{{ notice_title }}</h5>
            <p class="text-muted fs-13 mb-4" style="line-height: 1.65;">{{ notice_body }}</p>
            <a href="/login" class="btn btn-primary px-4">
              <i class="fa fa-arrow-left me-2"></i>Back to Sign In
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
