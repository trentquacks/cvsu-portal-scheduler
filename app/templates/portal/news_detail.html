{% extends "layouts/base_portal.html" %}

{% block content %}
<div class="card">
  <div class="card-header">
    <div>
      <h5 class="card-title mb-1">{{ article.title }}</h5>
      <div class="small text-muted"><i class="fa fa-calendar-o me-1"></i>Posted on {{ article.date_posted }}</div>
    </div>
    <a href="/dashboard" class="btn btn-sm btn-outline-primary">
      <i class="fa fa-arrow-left me-1"></i>Back to Dashboard
    </a>
  </div>
  <div class="card-body">
    <p class="mb-0" style="line-height: 1.7;">{{ article.content }}</p>
  </div>
</div>
{% endblock %}
