{% if flashes %}
  {% for item in flashes %}
    <div class="alert alert-{{ item.category }} alert-dismissible fade show py-2 px-3 small" role="alert">
      {{ item.message }}
      <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
  {% endfor %}
{% endif %}
